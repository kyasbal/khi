steps:
  - id: install_deps
    name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        cd ./web
        npm ci
        cd ../scripts/msdf-generator
        npm ci
    waitFor:
      - "-"
  - id: build web for internal version
    name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web-internal-beta
    waitFor:
      - install_deps
  - id: build test version container
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --file=./Dockerfile
      - -t
      - gcr.io/khi-internal/standalone:$COMMIT_SHA
      - .
    waitFor:
      - build web for internal version
images:
  - gcr.io/khi-internal/standalone:$COMMIT_SHA
options:
  machineType: E2_HIGHCPU_32
