steps:
  - id: install_deps
    name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        cd ./web
        npm ci
        cd ../scripts/msdf-generator
        npm ci
    waitFor:
      - "-"
  - id: build-web
    name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web
    waitFor:
      - install_deps
  - id: test go
    name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make coverage-go
    waitFor:
      - "build-web"
  - name: "gcr.io/kubernetes-history-inspector/builder:latest"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make check-format-go
    waitFor:
      - "build-web"
  - name: "golangci/golangci-lint:v2.7.1"
    entrypoint: "golangci-lint"
    args: ["run", "--config=.golangci.yaml"]
    id: "Run-golangci-lint"
    waitFor:
      - "build-web"

artifacts:
  objects:
    location: "gs://kubernetes-history-inspector_cloudbuild/artifacts/$COMMIT_SHA"
    paths:
      - go-cover.html
options:
  machineType: E2_HIGHCPU_32
