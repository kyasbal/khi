steps:
  - id: npm install
    name: node:22-trixie
    entrypoint: /bin/bash
    args:
      - -c
      - |
        cd ./web
        npm ci
        cd ..
        npx @bufbuild/buf generate
        cd web
        npx prettier --write "src/app/generated/**/*.d.ts"
        cd ..
        touch scripts/make/build-proto.done # this step uses go and node dependnecy. So run commands inside separately
        cd scripts/msdf-generator && npm i
    waitFor:
      - "-"
  - id: codegen
    name: golang:1.25-trixie
    entrypoint: /bin/bash
    args:
      - -c
      - |
        apt-get update && apt-get install jq -y
        make generate-frontend
        make generate-backend
        go run ./scripts/fontlist-gen
    waitFor:
      - "npm install"
  - id: build-web
    name: node:22-trixie
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web
    waitFor:
      - codegen
  - id: test go
    name: golang:1.25-trixie
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make coverage-go
    waitFor:
      - "build-web"
  - name: golang:1.25-trixie
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make check-format-go
    waitFor:
      - "build-web"
  - name: "golangci/golangci-lint:v2.7.1"
    entrypoint: "golangci-lint"
    args: ["run", "--config=.golangci.yaml"]
    id: "Run-golangci-lint"
    waitFor:
      - "build-web"

artifacts:
  objects:
    location: "gs://kubernetes-history-inspector_cloudbuild/artifacts/$COMMIT_SHA"
    paths:
      - go-cover.html
options:
  machineType: E2_HIGHCPU_32
