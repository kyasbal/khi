steps:
  - id: npm install
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        cd ./web
        npm ci
    waitFor:
      - "-"
  - id: generate frontend codes
    name: golang:1.24
    entrypoint: /bin/bash
    args:
      - -c
      - |
        apt-get update && apt-get install jq -y
        make prepare-frontend
    waitFor:
      - npm install
  - id: build web beta
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web-internal-beta
    waitFor:
      - generate frontend codes
  - id: build beta container
    name: "gcr.io/cloud-builders/docker"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        docker build --file=./Dockerfile -t gcr.io/khi-internal/standalone:beta -t gcr.io/khi-internal/standalone:beta-$(cat ./VERSION) .
        docker push gcr.io/khi-internal/standalone:beta
        docker push gcr.io/khi-internal/standalone:beta-$(cat ./VERSION)
    waitFor:
      - build web beta
  - id: build web viewer mode
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web-internal-khi-ro
    waitFor:
      - build beta container # This overwrite the result from build web. Thus it can't be run parallel with building container
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        rm .gcloudignore
        mv ./scripts/private/khi-ro.gcloudignore .gcloudignore
        gcloud app deploy --project="google.com:khi-ro" --no-promote --version beta
    waitFor:
      - build web viewer mode
images:
  - gcr.io/khi-internal/standalone:beta
options:
  machineType: E2_HIGHCPU_32