steps:
  - id: npm install
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        cd ./web
        npm ci
    waitFor:
      - "-"
  - id: build web
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        make build-web
    waitFor:
      - npm install
  - id: build latest container
    name: "gcr.io/cloud-builders/docker"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        docker build --file=./Dockerfile -t gcr.io/kubernetes-history-inspector/standalone:latest -t gcr.io/kubernetes-history-inspector/standalone:$(cat ./VERSION) .
        docker push gcr.io/kubernetes-history-inspector/standalone:latest
        docker push gcr.io/kubernetes-history-inspector/standalone:$(cat ./VERSION)
    waitFor:
      - build web
  - id: build web viewer mode
    name: node:18
    entrypoint: /bin/bash
    args:
      - -c
      - |
        NG_APP_GOOGLE_DRIVE_CLIENT_ID="173883494332-f5o6gkmpb5fku5u3vp43279mqbj24pe5.apps.googleusercontent.com" make build-web-viewer-mode
    waitFor:
      - build latest container # This overwrite the result from build web. Thus it can't be run parallel with building container
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: /bin/bash
    args:
      - -c
      - |
        gcloud app deploy --project="google.com:khi-ro" --ignore-file=.gcloudignore-khi-ro --version latest
    waitFor:
      - build web viewer mode
images:
  - gcr.io/kubernetes-history-inspector/standalone:latest
options:
  machineType: E2_HIGHCPU_32