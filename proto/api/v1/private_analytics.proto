edition = "2023";

package api.v1;

option go_package = "github.com/GoogleCloudPlatform/khi/pkg/generated/api/v1;apiv1";

// InitActivityPayload describes a page load initialization event.
message InitActivityPayload {
  // Type of the loaded page.
  string page_type = 1;
}

// InspectActivityPayload describes an inspection start event.
message InspectActivityPayload {}

// OpenInspectionDataActivityPayload describes metrics when inspection data is opened.
message OpenInspectionDataActivityPayload {
  // SHA-512 hash of raw inspection data for dedup and identification.
  string inspection_data_hash = 1;

  // Unique identifier for the data open session.
  string open_id = 2;

  // Number of log entries.
  int64 log_length = 3;

  // Decompressed text buffer size in bytes.
  int64 decompressed_text_buffer_length = 4;

  // Number of revisions across all timelines.
  int64 revision_count = 5;

  // Number of events across all timelines.
  int64 event_count = 6;
}

// ReportActivityRequest encapsulates a user activity event.
message ReportActivityRequest {
  // Specialized payload for the reported activity type.
  oneof payload {
    InitActivityPayload init = 1;
    InspectActivityPayload inspect = 2;
    OpenInspectionDataActivityPayload open_inspection_data = 3;
  }
}

// ReportActivityResponse confirms activity reporting.
message ReportActivityResponse {}

// PrivateAnalyticsService provides APIs for recording user activities.
service PrivateAnalyticsService {
  // Reports user activity to the analytics backend.
  rpc ReportActivity(ReportActivityRequest) returns (ReportActivityResponse);
}
