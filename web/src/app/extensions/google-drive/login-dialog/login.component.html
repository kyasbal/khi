<div>
  <h1 mat-dialog-title>Authentication required</h1>
  <div mat-dialog-content>
    <p>
      This link includes Google Drive File ID. To retrieve the inspection data
      from Google Drive, you have to sign in with your Google Account.
    </p>
  </div>
  <div mat-dialog-actions>
    <button mat-raised-button [mat-dialog-close]="true" color="primary">
      Continue with Google
    </button>
  </div>
</div>
