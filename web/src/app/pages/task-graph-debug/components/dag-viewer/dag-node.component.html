<svg:rect
  class="node-card-bg"
  x="0"
  y="0"
  [attr.width]="node().width"
  [attr.height]="node().height"
  rx="8"
  ry="8"
/>

<svg:rect
  class="node-accent-bar"
  x="0"
  y="0"
  width="5"
  [attr.height]="node().height"
  rx="2.5"
  ry="2.5"
/>

<svg:title>{{ node().referenceId }}</svg:title>

@if (displayDomain()) {
  <svg:text class="node-domain-text" x="14" y="18">
    {{ displayDomain() }}
  </svg:text>
}

<svg:text class="node-task-text" x="14" [attr.y]="taskTextY()">
  {{ displayTaskName() }}
</svg:text>

<svg:text class="node-impl-text" x="14" y="51">
  {{ displayImplementationId() }}
</svg:text>

<svg:g class="node-badges-group" transform="translate(14, 61)">
  @if (node().isFeature) {
    <svg:g class="badge-group feature-badge">
      <svg:rect class="badge-bg" x="0" y="0" width="56" height="18" rx="4" />
      <svg:text class="badge-text" x="28" y="10">Feature</svg:text>
    </svg:g>
  }

  @if (node().isInitialTask) {
    <svg:g
      class="badge-group init-badge"
      [attr.transform]="initBadgeTransform()"
    >
      <svg:rect class="badge-bg" x="0" y="0" width="36" height="18" rx="4" />
      <svg:text class="badge-text" x="18" y="10">Init</svg:text>
    </svg:g>
  }

  <svg:g class="badge-group prio-badge" [attr.transform]="prioBadgeTransform()">
    <svg:rect class="badge-bg" x="0" y="0" width="46" height="18" rx="4" />
    <svg:text class="badge-text" x="23" y="10">
      {{ "P" + node().priority }}
    </svg:text>
  </svg:g>
</svg:g>
